<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>2026 金門迎城隍 即時定位與直播系統</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:"Microsoft JhengHei",sans-serif;
    background:#f5f5f5;
}

#map{
    width:100%;
    height:100vh;
    z-index:1;
}

.control-panel{
    position:absolute;
    top:10px;
    left:10px;
    z-index:9999;
    width:320px;
    max-height:92vh;
    overflow:hidden;
    background:rgba(255,255,255,0.97);
    border-radius:14px;
    box-shadow:0 4px 20px rgba(0,0,0,0.25);
    display:flex;
    flex-direction:column;
    transition:0.3s;
}

.control-panel.minimized{
    width:150px;
    height:42px;
}

.panel-header{
    background:#c62828;
    color:#fff;
    padding:10px;
    font-size:15px;
    font-weight:bold;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
}

.panel-content{
    overflow-y:auto;
    padding:10px;
}

.control-panel.minimized .panel-content{
    display:none;
}

.live-clock{
    background:#8e0000;
    color:#fff;
    text-align:center;
    padding:5px;
    font-family:monospace;
    font-size:14px;
    letter-spacing:1px;
}

button{
    width:100%;
    border:none;
    border-radius:8px;
    padding:9px;
    margin-bottom:6px;
    font-weight:bold;
    cursor:pointer;
    font-size:13px;
}

.btn-toggle{
    width:auto;
    background:none;
    color:#fff;
    border:1px solid #fff;
    padding:2px 6px;
    margin:0;
}

.btn-admin{
    background:#ff9800;
    color:white;
}

.btn-tail{
    background:#4caf50;
    color:white;
}

.btn-clear{
    background:#607d8b;
    color:#fff;
}

.status-info{
    text-align:center;
    font-size:12px;
    color:#555;
    margin-top:4px;
    font-weight:bold;
}

.dist-info{
    text-align:center;
    font-size:15px;
    color:#d32f2f;
    font-weight:bold;
    margin:6px 0;
}

.youtube-box{
    width:100%;
    aspect-ratio:16/9;
    border-radius:10px;
    overflow:hidden;
    background:#000;
    margin-bottom:10px;
}

.youtube-box iframe{
    width:100%;
    height:100%;
    border:none;
}

.report-section{
    border-top:2px solid #eee;
    margin-top:10px;
    padding-top:10px;
}

.report-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
}

.report-title{
    font-size:14px;
    font-weight:bold;
}

.btn-reset{
    width:auto;
    padding:3px 8px;
    background:#eee;
    color:#666;
    font-size:11px;
    margin:0;
}

.btn-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.report-item{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.btn-report{
    background:#fff;
    border:1px solid #ddd;
    margin:0;
}

.btn-arrived{
    border-left:5px solid #4caf50;
}

.btn-left{
    border-left:5px solid #f44336;
}

.time-label{
    margin-top:4px;
    font-size:16px;
    font-weight:900;
    color:#d32f2f;
    height:20px;
}

.marker-icon{
    display:flex;
    justify-content:center;
    align-items:center;
    width:42px;
    height:42px;
    border-radius:50%;
    background:#fff;
    font-size:24px;
    box-shadow:0 0 12px rgba(0,0,0,0.3);
}

.god-marker{
    border:3px solid #d32f2f;
    animation:pulse 2s infinite;
}

.tail-marker{
    border:3px solid #4caf50;
}

@keyframes pulse{
    0%{
        box-shadow:0 0 0 0 rgba(211,47,47,0.7);
    }
    70%{
        box-shadow:0 0 0 12px rgba(211,47,47,0);
    }
    100%{
        box-shadow:0 0 0 0 rgba(211,47,47,0);
    }
}

@media(max-width:768px){
    .control-panel{
        width:94%;
        left:3%;
        top:8px;
    }
}
</style>
</head>

<body>

<div id="mainPanel" class="control-panel">

    <div class="panel-header" onclick="togglePanel()">
        <span>👮‍♂️ 2026 金門迎城隍勤務</span>
        <button class="btn-toggle" id="toggleBtn">收合</button>
    </div>

    <div id="liveClock" class="live-clock">
        ----/--/-- --:--:--
    </div>

    <div class="panel-content">

        <!-- YouTube LIVE -->
        <div class="youtube-box">
            <iframe
                src="https://www.youtube.com/embed/0PLVzLXfoqk?autoplay=1&mute=1"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>

        <button id="tailBtn" class="btn-tail" onclick="toggleTailMode()">
            🚩 隊伍尾端定位回報
        </button>

        <button id="adminBtn" class="btn-admin" onclick="toggleAdminMode()">
            📡 神轎位置回報
        </button>

        <div id="statusText" class="status-info">
            等待定位資料中...
        </div>

        <div id="distanceText" class="dist-info">
            隊伍長度：-- 公尺
        </div>

        <!-- 長官蒞臨 -->
        <div class="report-section">

            <div class="report-header">
                <span class="report-title">📌 長官蒞臨時間</span>
                <button class="btn-reset" onclick="resetSection('蒞')">清空</button>
            </div>

            <div class="btn-grid" id="arrivalGrid"></div>
        </div>

        <!-- 長官離轄 -->
        <div class="report-section">

            <div class="report-header">
                <span class="report-title">🚶 長官離轄時間</span>
                <button class="btn-reset" onclick="resetSection('離')">清空</button>
            </div>

            <div class="btn-grid" id="departureGrid"></div>
        </div>

        <button class="btn-clear" onclick="clearRoutePath()">
            🧹 清除今日行走軌跡
        </button>

    </div>
</div>

<div id="map"></div>

<script>

/* =========================================================
   1. 路線資料
========================================================= */

const rawCoords = [
[118.31598185256757,24.432490591580518],
[118.31588557768761,24.432564156830114],
[118.31578930280764,24.43263772207971],
[118.31569302792768,24.432711287329308],
[118.31559675304771,24.432784852578905],
[118.31536996766096,24.43270930151033],
[118.3151431822742,24.432633750441752]
];

const routePoints = rawCoords.map(p => [p[1], p[0]]);

/* =========================================================
   2. 地圖初始化
========================================================= */

const map = L.map('map',{
    zoomControl:false
}).setView([24.4335,118.3165],16);

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution:'© OpenStreetMap'
    }
).addTo(map);

/* 粉紅色預定路線 */
const routeLine = L.polyline(routePoints,{
    color:'#ff1493',
    weight:6,
    opacity:0.7
}).addTo(map);

/* 灰色虛線已走過 */
const passedPath = L.polyline([],{
    color:'#666',
    weight:4,
    dashArray:'6,10',
    opacity:0.9
}).addTo(map);

/* =========================================================
   3. Marker
========================================================= */

const godIcon = L.divIcon({
    html:'<div class="marker-icon god-marker">👨‍⚖️</div>',
    className:'',
    iconSize:[42,42],
    iconAnchor:[21,21]
});

const tailIcon = L.divIcon({
    html:'<div class="marker-icon tail-marker">🚩</div>',
    className:'',
    iconSize:[40,40],
    iconAnchor:[20,20]
});

const palanquinMarker = L.marker(routePoints[0],{
    icon:godIcon
}).addTo(map);

const tailMarker = L.marker([0,0],{
    icon:tailIcon,
    opacity:0
}).addTo(map);

/* =========================================================
   4. Firebase
========================================================= */

const firebaseConfig = {
    apiKey:"AIzaSyAWtgeRkdjtaHdtnoKdgOMQ_PTBMpwmsLI",
    databaseURL:"https://kinmen-location-default-rtdb.firebaseio.com",
    projectId:"kinmen-location"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

/* =========================================================
   5. 面板
========================================================= */

function togglePanel(){
    const panel = document.getElementById('mainPanel');
    const btn = document.getElementById('toggleBtn');

    panel.classList.toggle('minimized');

    btn.innerText =
        panel.classList.contains('minimized')
        ? '展開'
        : '收合';
}

/* =========================================================
   6. 時鐘
========================================================= */

function updateClock(){

    const now = new Date();

    const y = now.getFullYear();
    const m = String(now.getMonth()+1).padStart(2,'0');
    const d = String(now.getDate()).padStart(2,'0');

    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    const ss = String(now.getSeconds()).padStart(2,'0');

    document.getElementById('liveClock').innerText =
        `${y}/${m}/${d} ${hh}:${mm}:${ss}`;
}

setInterval(updateClock,1000);
updateClock();

/* =========================================================
   7. 定位同步
========================================================= */

let godPos = null;
let tailPos = null;

function calculateDistance(){

    if(godPos && tailPos){

        const d =
            L.latLng(godPos)
            .distanceTo(L.latLng(tailPos));

        document.getElementById('distanceText')
        .innerText = `隊伍長度：${Math.round(d)} 公尺`;
    }
}

function syncPalanquin(lat,lng){

    godPos = [lat,lng];

    const currentPos = L.latLng(lat,lng);

    let minDist = Infinity;
    let closestIdx = 0;

    routePoints.forEach((p,i)=>{

        const d =
            L.latLng(p).distanceTo(currentPos);

        if(d < minDist){
            minDist = d;
            closestIdx = i;
        }
    });

    passedPath.setLatLngs(
        routePoints.slice(0,closestIdx+1)
    );

    palanquinMarker.setLatLng(
        routePoints[closestIdx]
    );

    calculateDistance();
}

/* 神轎位置 */

db.ref('palanquin/location')
.on('value',(snapshot)=>{

    const d = snapshot.val();

    if(d){

        syncPalanquin(d.lat,d.lng);

        document.getElementById('statusText')
        .innerText =
            '最後更新：' +
            new Date(d.timestamp)
            .toLocaleTimeString();
    }
});

/* 隊尾位置 */

db.ref('palanquin/tail')
.on('value',(snapshot)=>{

    const d = snapshot.val();

    if(d){

        tailPos = [d.lat,d.lng];

        tailMarker
            .setLatLng(tailPos)
            .setOpacity(1);

        calculateDistance();
    }
});

/* =========================================================
   8. 清除軌跡
========================================================= */

db.ref('system/pathReset')
.on('value',()=>{

    passedPath.setLatLngs([]);
});

function clearRoutePath(){

    if(confirm('確定清除今日行走軌跡？')){

        db.ref('system/pathReset')
        .set(Date.now());
    }
}

/* =========================================================
   9. 神轎定位模式
========================================================= */

let isAdmin = false;
let watchId = null;

function toggleAdminMode(){

    if(!isAdmin){

        if(confirm('啟動神轎定位發送？')){

            isAdmin = true;

            const btn =
                document.getElementById('adminBtn');

            btn.innerText = '🛑 停止發送(頭)';
            btn.style.background = '#f44336';

            watchId =
                navigator.geolocation.watchPosition(

                    (p)=>{

                        db.ref('palanquin/location')
                        .set({
                            lat:p.coords.latitude,
                            lng:p.coords.longitude,
                            timestamp:Date.now()
                        });
                    },

                    (err)=>{
                        alert(err.message);
                    },

                    {
                        enableHighAccuracy:true
                    }
                );
        }

    }else{

        isAdmin = false;

        const btn =
            document.getElementById('adminBtn');

        btn.innerText = '📡 神轎位置回報';
        btn.style.background = '#ff9800';

        navigator.geolocation.clearWatch(watchId);
    }
}

/* =========================================================
   10. 隊尾模式
========================================================= */

let isTail = false;
let tailWatchId = null;

function toggleTailMode(){

    if(!isTail){

        if(confirm('啟動隊伍尾端定位回報？')){

            isTail = true;

            const btn =
                document.getElementById('tailBtn');

            btn.innerText = '🛑 停止回報(尾)';
            btn.style.background = '#f44336';

            tailWatchId =
                navigator.geolocation.watchPosition(

                    (p)=>{

                        db.ref('palanquin/tail')
                        .set({
                            lat:p.coords.latitude,
                            lng:p.coords.longitude,
                            timestamp:Date.now()
                        });
                    },

                    (err)=>{
                        alert(err.message);
                    },

                    {
                        enableHighAccuracy:true
                    }
                );
        }

    }else{

        isTail = false;

        const btn =
            document.getElementById('tailBtn');

        btn.innerText = '🚩 隊伍尾端定位回報';
        btn.style.background = '#4caf50';

        navigator.geolocation.clearWatch(
            tailWatchId
        );
    }
}

/* =========================================================
   11. 長官回報
========================================================= */

const officials = [
    '縣長',
    '李副縣長',
    '陳副縣長',
    '議長',
    '副議長'
];

function initGrids(){

    const arrivalGrid =
        document.getElementById('arrivalGrid');

    const departureGrid =
        document.getElementById('departureGrid');

    officials.forEach(p=>{

        arrivalGrid.innerHTML += `
        <div class="report-item">
            <button class="btn-report btn-arrived"
                onclick="reportStatus('${p}','蒞轄')">
                ${p.replace('副縣長','副縣')}
            </button>
            <span id="time-${p}-蒞"
                class="time-label">--:--</span>
        </div>`;

        departureGrid.innerHTML += `
        <div class="report-item">
            <button class="btn-report btn-left"
                onclick="reportStatus('${p}','離轄')">
                ${p.replace('副縣長','副縣')}
            </button>
            <span id="time-${p}-離"
                class="time-label">--:--</span>
        </div>`;
    });
}

initGrids();

function reportStatus(person,action){

    const key =
        action === '蒞轄'
        ? '蒞'
        : '離';

    db.ref(`officials/${person}/${key}`)
    .set({
        timestamp:Date.now()
    });
}

function resetSection(key){

    if(!confirm('確定清空時間？')) return;

    db.ref('officials')
    .once('value',(snapshot)=>{

        const data = snapshot.val();

        if(!data) return;

        Object.keys(data).forEach(person=>{

            db.ref(`officials/${person}/${key}`)
            .remove();
        });
    });
}

db.ref('officials')
.on('value',(snapshot)=>{

    const data = snapshot.val() || {};

    officials.forEach(person=>{

        ['蒞','離'].forEach(k=>{

            const el =
                document.getElementById(
                    `time-${person}-${k}`
                );

            if(data[person] && data[person][k]){

                const t =
                    new Date(
                        data[person][k].timestamp
                    );

                el.innerText =
                    `${String(t.getHours()).padStart(2,'0')}:`+
                    `${String(t.getMinutes()).padStart(2,'0')}`;

            }else{

                el.innerText = '--:--';
            }
        });
    });
});

</script>

</body>
</html>
