<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>2026 金門迎城隍勤務系統</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:"Microsoft JhengHei",sans-serif;
}

#map{
    width:100%;
    height:100vh;
}

/* =====================================================
   主控制面板
===================================================== */

.control-panel{
    position:absolute;
    top:10px;
    left:10px;
    z-index:1000;

    width:340px;
    max-height:92vh;

    overflow:hidden;

    background:rgba(255,255,255,.97);

    border-radius:14px;

    box-shadow:0 5px 18px rgba(0,0,0,.25);

    display:flex;
    flex-direction:column;

    transition:.3s;
}

/* 收合後大小 */

.control-panel.minimized{
    width:260px;
    height:42px;
}

/* 頂部 */

.panel-header{
    background:#c62828;
    color:white;

    padding:8px 10px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    cursor:pointer;

    white-space:nowrap;
}

/* 標題 */

.panel-header span{
    font-size:16px;
    font-weight:bold;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

/* 收合按鈕 */

.btn-toggle{
    width:auto;
    margin:0;
    padding:2px 8px;

    background:none;
    color:white;

    border:1px solid white;
    border-radius:5px;

    font-size:12px;

    flex-shrink:0;
}

/* 面板內容 */

.panel-content{
    overflow-y:auto;
    padding:10px;
}

.control-panel.minimized .panel-content{
    display:none;
}

/* 時鐘 */

.live-clock{
    background:#8e0000;
    color:white;
    text-align:center;

    padding:5px 0;

    font-family:monospace;
    letter-spacing:1px;
}

/* 按鈕 */

button{
    width:100%;
    border:none;
    border-radius:8px;

    padding:9px;

    margin-bottom:6px;

    font-weight:bold;

    cursor:pointer;
}

/* 原功能按鈕 */

.btn-admin{
    background:#ff9800;
    color:white;
}

.btn-tail{
    background:#43a047;
    color:white;
}

/* 資訊 */

.status-info{
    text-align:center;
    margin-top:5px;
    font-size:12px;
    color:#555;
    font-weight:bold;
}

.dist-info{
    text-align:center;
    margin-top:6px;
    color:#c62828;
    font-size:14px;
    font-weight:bold;
}

/* =====================================================
   跳崗部署
===================================================== */

.jump-section{
    margin-top:10px;
    border-top:2px solid #eee;
    padding-top:10px;
}

.section-title{
    font-size:15px;
    font-weight:bold;
    margin-bottom:8px;
}

/* 階段按鈕 */

.stage-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.stage-btn{
    color:white;
}

.stage1{ background:#1565c0; }
.stage2{ background:#ef6c00; }
.stage3{ background:#8e24aa; }
.stage4{ background:#2e7d32; }

.reset-force{
    background:#455a64;
    color:white;
    margin-top:8px;
}

/* =====================================================
   指揮統計
===================================================== */

.command-panel{
    margin-top:10px;
    border-top:2px solid #eee;
    padding-top:10px;
}

.command-box{
    background:#fafafa;
    border:1px solid #ddd;
    border-radius:10px;
    padding:10px;
}

.command-item{
    display:flex;
    justify-content:space-between;
    margin-bottom:6px;
}

.command-value{
    color:#d32f2f;
    font-weight:bold;
}

/* =====================================================
   Marker
===================================================== */

.marker-icon{
    display:flex;
    justify-content:center;
    align-items:center;

    width:40px;
    height:40px;

    border-radius:50%;

    background:white;

    border:2px solid #c62828;

    font-size:22px;

    box-shadow:0 0 10px rgba(0,0,0,.3);
}

/* 神轎動畫 */

.god-marker{
    animation:pulse 2s infinite;
}

.tail-marker{
    border-color:#43a047;
}

/* 警力 */

.police-marker{
    width:18px;
    height:18px;

    border-radius:50%;

    border:2px solid white;

    box-shadow:0 0 6px rgba(0,0,0,.5);
}

@keyframes pulse{

    0%{
        box-shadow:0 0 0 0 rgba(198,40,40,.7);
    }

    70%{
        box-shadow:0 0 0 10px rgba(198,40,40,0);
    }

    100%{
        box-shadow:0 0 0 0 rgba(198,40,40,0);
    }
}

</style>
</head>

<body>

<!-- =====================================================
     主控制面板
===================================================== -->

<div id="mainPanel" class="control-panel">

    <!-- 頂端 -->

    <div class="panel-header" onclick="togglePanel()">

        <span>👮‍♂️ 2026金門迎城隍勤務</span>

        <button class="btn-toggle"
        id="toggleBtn">
        收合
        </button>

    </div>

    <!-- 時鐘 -->

    <div id="liveClock"
    class="live-clock">
    </div>

    <!-- 面板內容 -->

    <div class="panel-content">

        <!-- 原功能 -->

        <button id="tailBtn"
        class="btn-tail">
        🚩 隊伍尾端回報
        </button>

        <button id="adminBtn"
        class="btn-admin">
        📡 神轎位置回報
        </button>

        <div id="statusText"
        class="status-info">
        等待數據中...
        </div>

        <div id="distanceText"
        class="dist-info">
        隊伍長度：-- 公尺
        </div>

        <!-- 跳崗部署 -->

        <div class="jump-section">

            <div class="section-title">
            🚓 警力跳崗部署
            </div>

            <div class="stage-grid">

                <button class="stage-btn stage1"
                onclick="runStage(1)">
                第1階段
                </button>

                <button class="stage-btn stage2"
                onclick="runStage(2)">
                第2階段
                </button>

                <button class="stage-btn stage3"
                onclick="runStage(3)">
                第3階段
                </button>

                <button class="stage-btn stage4"
                onclick="runStage(4)">
                第4階段
                </button>

            </div>

            <button class="reset-force"
            onclick="resetPolice()">
            ↩ 重置警力
            </button>

        </div>

        <!-- 指揮統計 -->

        <div class="command-panel">

            <div class="section-title">
            📊 指揮統計
            </div>

            <div class="command-box">

                <div class="command-item">
                    <span>總警力</span>
                    <span class="command-value">
                    100 人
                    </span>
                </div>

                <div class="command-item">
                    <span>目前階段</span>
                    <span id="stageLabel"
                    class="command-value">
                    第1階段
                    </span>
                </div>

                <div class="command-item">
                    <span>移動中警力</span>
                    <span id="movingCount"
                    class="command-value">
                    0 人
                    </span>
                </div>

                <div class="command-item">
                    <span>完成部署</span>
                    <span id="arrivedCount"
                    class="command-value">
                    100 人
                    </span>
                </div>

            </div>

        </div>

    </div>

</div>

<!-- 地圖 -->

<div id="map"></div>

<script>

/* =====================================================
   1. 繞境路線
===================================================== */

const rawCoords = [

[118.31598185256757,24.432490591580518],
[118.31588557768761,24.432564156830114],
[118.31578930280764,24.43263772207971],
[118.31569302792768,24.432711287329308],
[118.31559675304771,24.432784852578905],
[118.31536996766096,24.43270930151033],
[118.3151431822742,24.432633750441752],
[118.31500769258054,24.432759653379634],
[118.31466096651604,24.43263660189679],
[118.31443911614434,24.433037403086345],
[118.3147095189529,24.433315152180626],
[118.31482230303706,24.4331652943072],
[118.31496966114895,24.433065800804854],
[118.31512375737375,24.433054902114108],
[118.31520179073232,24.433151027789364],
[118.3154965906545,24.43352347996357],
[118.31594351631071,24.433958887263998],
[118.31626267614791,24.43352987765745],
[118.31655393496982,24.433097557369628]

];

/* Leaflet格式 */

const routePoints =
rawCoords.map(p=>[p[1],p[0]]);

/* =====================================================
   2. 地圖初始化
===================================================== */

const map = L.map('map',{
    zoomControl:false
}).setView([24.4335,118.3165],16);

/* 地圖底圖 */

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution:'© OpenStreetMap'
}
).addTo(map);

/* =====================================================
   3. 淡紅色繞境路線
===================================================== */

const paradeRoute = L.polyline(
    routePoints,
    {
        color:'#ef9a9a',
        weight:7,
        opacity:0.9,
        lineJoin:'round'
    }
).addTo(map);

/* 已行經灰色路線 */

const passedPath = L.polyline(
    [],
    {
        color:'#616161',
        weight:4,
        dashArray:'5,8',
        opacity:0.8
    }
).addTo(map);

/* =====================================================
   4. 神轎與隊尾 marker
===================================================== */

const godIcon = L.divIcon({
    html:`
    <div class="marker-icon god-marker">
    👨‍⚖️
    </div>
    `,
    className:'',
    iconSize:[40,40],
    iconAnchor:[20,20]
});

const tailIcon = L.divIcon({
    html:`
    <div class="marker-icon tail-marker">
    🚩
    </div>
    `,
    className:'',
    iconSize:[36,36],
    iconAnchor:[18,18]
});

/* 神轎 */

const palanquinMarker =
L.marker(routePoints[0],{
    icon:godIcon
}).addTo(map);

/* 隊尾 */

const tailMarker =
L.marker(routePoints[0],{
    icon:tailIcon
}).addTo(map);

/* =====================================================
   5. 建立100警力
===================================================== */

const policeMarkers = [];

const stageColors = {
    1:'#1565c0',
    2:'#ef6c00',
    3:'#8e24aa',
    4:'#2e7d32'
};

function randomOffset(){
    return (Math.random()-0.5)*0.002;
}

for(let i=0;i<100;i++){

    const lat = 24.4335 + randomOffset();
    const lng = 118.3165 + randomOffset();

    const icon = L.divIcon({
        className:'',
        html:`
        <div class="police-marker"
        style="background:${stageColors[1]}">
        </div>
        `,
        iconSize:[18,18],
        iconAnchor:[9,9]
    });

    const marker =
    L.marker([lat,lng],{
        icon
    }).addTo(map);

    marker.bindTooltip(`警力 ${i+1}`);

    policeMarkers.push(marker);
}

/* =====================================================
   6. 平滑動畫
===================================================== */

function smoothMove(
    marker,
    start,
    end,
    duration,
    color
){

    const startTime = performance.now();

    function animate(now){

        const progress =
        Math.min(
            (now-startTime)/duration,
            1
        );

        const lat =
        start[0] +
        (end[0]-start[0])*progress;

        const lng =
        start[1] +
        (end[1]-start[1])*progress;

        marker.setLatLng([lat,lng]);

        marker.setIcon(
            L.divIcon({
                className:'',
                html:`
                <div class="police-marker"
                style="background:${color}">
                </div>
                `,
                iconSize:[18,18],
                iconAnchor:[9,9]
            })
        );

        if(progress < 1){
            requestAnimationFrame(animate);
        }
    }

    requestAnimationFrame(animate);
}

/* =====================================================
   7. 跳崗部署
===================================================== */

function generateStageTarget(stage,index){

    const base =
    routePoints[index % routePoints.length];

    let factor = 0.0008 * stage;

    return [

        base[0] +
        ((Math.random()-0.5)*factor),

        base[1] +
        ((Math.random()-0.5)*factor)

    ];
}

function runStage(stage){

    document.getElementById('stageLabel')
    .innerText=`第${stage}階段`;

    let moving = 0;

    policeMarkers.forEach((marker,index)=>{

        let shouldMove = false;

        if(stage===1){
            shouldMove = true;
        }

        if(stage===2 && index < 35){
            shouldMove = true;
        }

        if(stage===3 &&
            index >=35 &&
            index <70){
            shouldMove = true;
        }

        if(stage===4 &&
            index >=70){
            shouldMove = true;
        }

        if(shouldMove){

            moving++;

            const current =
            marker.getLatLng();

            const target =
            generateStageTarget(stage,index);

            smoothMove(
                marker,
                [current.lat,current.lng],
                target,
                3000 + Math.random()*2000,
                stageColors[stage]
            );
        }

    });

    document.getElementById('movingCount')
    .innerText=`${moving} 人`;

    document.getElementById('arrivedCount')
    .innerText=`${100-moving} 人`;

    setTimeout(()=>{

        document.getElementById('movingCount')
        .innerText='0 人';

        document.getElementById('arrivedCount')
        .innerText='100 人';

    },5500);
}

/* =====================================================
   8. 重置警力
===================================================== */

function resetPolice(){

    policeMarkers.forEach(marker=>{

        const lat =
        24.4335 + randomOffset();

        const lng =
        118.3165 + randomOffset();

        marker.setLatLng([lat,lng]);

        marker.setIcon(
            L.divIcon({
                className:'',
                html:`
                <div class="police-marker"
                style="background:${stageColors[1]}">
                </div>
                `,
                iconSize:[18,18],
                iconAnchor:[9,9]
            })
        );

    });

    document.getElementById('stageLabel')
    .innerText='第1階段';

    document.getElementById('movingCount')
    .innerText='0 人';

    document.getElementById('arrivedCount')
    .innerText='100 人';
}

/* =====================================================
   9. 即時時鐘
===================================================== */

function updateClock(){

    const now = new Date();

    const y =
    now.getFullYear();

    const m =
    String(now.getMonth()+1)
    .padStart(2,'0');

    const d =
    String(now.getDate())
    .padStart(2,'0');

    const hh =
    String(now.getHours())
    .padStart(2,'0');

    const mm =
    String(now.getMinutes())
    .padStart(2,'0');

    const ss =
    String(now.getSeconds())
    .padStart(2,'0');

    document.getElementById('liveClock')
    .innerText=
    `${y}/${m}/${d} ${hh}:${mm}:${ss}`;
}

setInterval(updateClock,1000);

updateClock();

/* =====================================================
   10. 收合面板
===================================================== */

function togglePanel(){

    const panel =
    document.getElementById('mainPanel');

    const btn =
    document.getElementById('toggleBtn');

    panel.classList.toggle('minimized');

    btn.innerText =
    panel.classList.contains('minimized')
    ? '展開'
    : '收合';
}

/* =====================================================
   11. 模擬神轎移動
===================================================== */

let routeIndex = 0;

setInterval(()=>{

    routeIndex++;

    if(routeIndex >= routePoints.length){
        routeIndex = 0;
    }

    const point =
    routePoints[routeIndex];

    /* 神轎 */

    palanquinMarker.setLatLng(point);

    /* 已行經 */

    passedPath.setLatLngs(
        routePoints.slice(
            0,
            routeIndex+1
        )
    );

    /* 隊尾 */

    const tailIndex =
    Math.max(0,routeIndex-2);

    tailMarker.setLatLng(
        routePoints[tailIndex]
    );

    /* 距離 */

    const d =
    L.latLng(routePoints[routeIndex])
    .distanceTo(
        L.latLng(routePoints[tailIndex])
    );

    document.getElementById('distanceText')
    .innerText=
    `隊伍長度：${Math.round(d)} 公尺`;

    /* 狀態 */

    document.getElementById('statusText')
    .innerText=
    "最後更新：" +
    new Date().toLocaleTimeString();

},3000);

</script>

</body>
</html>
