<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>2026 金門迎城隍 即時勤務系統</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:"Microsoft JhengHei",sans-serif;
    background:#000;
}

#map{
    width:100%;
    height:100vh;
    z-index:1;
}

.control-panel{
    position:absolute;
    top:10px;
    left:10px;
    z-index:9999;
    width:330px;
    max-height:95vh;
    overflow-y:auto;

    background:rgba(255,255,255,0.97);
    border-radius:14px;

    box-shadow:0 4px 20px rgba(0,0,0,0.3);
}

.panel-header{
    background:#b71c1c;
    color:#fff;
    padding:12px;
    font-size:16px;
    font-weight:bold;
    text-align:center;
    border-radius:14px 14px 0 0;
}

.panel-body{
    padding:10px;
}

.live-box{
    width:100%;
    aspect-ratio:16/9;
    border-radius:10px;
    overflow:hidden;
    background:#000;
    margin-bottom:10px;
}

.live-box iframe{
    width:100%;
    height:100%;
    border:none;
}

.live-clock{
    background:#212121;
    color:#fff;
    text-align:center;
    padding:6px;
    border-radius:8px;
    margin-bottom:8px;
    font-family:monospace;
    font-size:15px;
}

.status{
    background:#f5f5f5;
    padding:8px;
    border-radius:8px;
    margin-bottom:8px;
    font-size:13px;
    text-align:center;
}

.distance{
    background:#fff3e0;
    color:#d84315;
    font-size:18px;
    text-align:center;
    padding:10px;
    border-radius:8px;
    margin-bottom:10px;
    font-weight:bold;
}

button{
    width:100%;
    border:none;
    border-radius:8px;
    padding:10px;
    margin-bottom:8px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    font-size:14px;
}

.btn-admin{
    background:#d32f2f;
}

.btn-tail{
    background:#388e3c;
}

.btn-clear{
    background:#546e7a;
}

.section{
    margin-top:10px;
    border-top:2px solid #eee;
    padding-top:10px;
}

.section-title{
    font-size:15px;
    font-weight:bold;
    margin-bottom:10px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.item{
    background:#fafafa;
    border-radius:8px;
    padding:5px;
    text-align:center;
    border:1px solid #ddd;
}

.item button{
    margin:0;
    font-size:12px;
}

.arrive{
    background:#43a047;
}

.leave{
    background:#e53935;
}

.time{
    margin-top:5px;
    font-size:18px;
    color:#d32f2f;
    font-weight:bold;
}

.marker-icon{
    display:flex;
    justify-content:center;
    align-items:center;
    width:42px;
    height:42px;
    border-radius:50%;
    background:white;
    border:3px solid #d32f2f;
    font-size:24px;
    box-shadow:0 0 10px rgba(0,0,0,0.4);
}

.god-marker{
    animation:pulse 2s infinite;
}

.tail-marker{
    border-color:#43a047;
}

@keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(211,47,47,.7);}
    70%{box-shadow:0 0 0 12px rgba(211,47,47,0);}
    100%{box-shadow:0 0 0 0 rgba(211,47,47,0);}
}

@media(max-width:768px){

.control-panel{
    width:95%;
    left:2.5%;
    top:5px;
}

}

</style>
</head>

<body>

<div class="control-panel">

    <div class="panel-header">
        2026 金門迎城隍 即時勤務系統
    </div>

    <div class="panel-body">

        <!-- YouTube LIVE -->
        <div class="live-box">

            <iframe
                src="https://www.youtube.com/embed/0PLVzLXfoqk?autoplay=1&mute=1"
                allow="autoplay; encrypted-media"
                allowfullscreen>
            </iframe>

        </div>

        <div class="live-clock" id="liveClock">
            ----/--/-- --:--:--
        </div>

        <div class="status" id="statusText">
            等待神轎定位資料...
        </div>

        <div class="distance" id="distanceText">
            隊伍長度：-- 公尺
        </div>

        <button class="btn-admin" onclick="toggleAdminMode()">
            📡 神轎頭定位回報
        </button>

        <button class="btn-tail" onclick="toggleTailMode()">
            🚩 隊伍尾端定位回報
        </button>

        <button class="btn-clear" onclick="clearRoutePath()">
            🧹 清除今日行經路線
        </button>

        <!-- 長官蒞臨 -->
        <div class="section">

            <div class="section-title">
                📌 長官蒞臨時間
            </div>

            <div class="grid" id="arrivalGrid"></div>

        </div>

        <!-- 長官離轄 -->
        <div class="section">

            <div class="section-title">
                🚶 長官離轄時間
            </div>

            <div class="grid" id="departureGrid"></div>

        </div>

    </div>
</div>

<div id="map"></div>

<script>

/* =========================================
   Firebase
========================================= */

const firebaseConfig = {

    apiKey: "AIzaSyAWtgeRkdjtaHdtnoKdgOMQ_PTBMpwmsLI",
    databaseURL: "https://kinmen-location-default-rtdb.firebaseio.com",
    projectId: "kinmen-location"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

/* =========================================
   地圖初始化
========================================= */

const map = L.map('map',{zoomControl:false})
.setView([24.4335,118.3165],16);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution:'© OpenStreetMap'
}
).addTo(map);

/* =========================================
   路線資料
========================================= */

const routePoints = [

[24.432490591580518,118.31598185256757],
[24.432564156830114,118.31588557768761],
[24.43263772207971,118.31578930280764],
[24.432711287329308,118.31569302792768],
[24.432784852578905,118.31559675304771],
[24.43270930151033,118.31536996766096],
[24.432633750441752,118.3151431822742],
[24.432759653379634,118.31500769258054]

];

/* 主路線 */

L.polyline(routePoints,{
    color:"#d32f2f",
    weight:6,
    opacity:0.4
}).addTo(map);

/* 已行經灰色虛線 */

const passedPath = L.polyline([],{
    color:"#555",
    weight:4,
    dashArray:"8,8",
    opacity:0.9
}).addTo(map);

/* =========================================
   ICON
========================================= */

const godIcon = L.divIcon({

    html:`<div class="marker-icon god-marker">👨‍⚖️</div>`,
    className:'',
    iconSize:[42,42],
    iconAnchor:[21,21]

});

const tailIcon = L.divIcon({

    html:`<div class="marker-icon tail-marker">🚩</div>`,
    className:'',
    iconSize:[42,42],
    iconAnchor:[21,21]

});

/* Marker */

const palanquinMarker = L.marker(routePoints[0],{
    icon:godIcon
}).addTo(map);

const tailMarker = L.marker(routePoints[0],{
    icon:tailIcon,
    opacity:0
}).addTo(map);

/* =========================================
   時鐘
========================================= */

function updateClock(){

    const now = new Date();

    const t =
        now.getFullYear() + "/" +
        String(now.getMonth()+1).padStart(2,'0') + "/" +
        String(now.getDate()).padStart(2,'0') + " " +
        String(now.getHours()).padStart(2,'0') + ":" +
        String(now.getMinutes()).padStart(2,'0') + ":" +
        String(now.getSeconds()).padStart(2,'0');

    document.getElementById("liveClock").innerText = t;
}

setInterval(updateClock,1000);
updateClock();

/* =========================================
   定位同步
========================================= */

let godPos = null;
let tailPos = null;

function calculateDistance(){

    if(godPos && tailPos){

        const d =
            L.latLng(godPos)
            .distanceTo(L.latLng(tailPos));

        document.getElementById("distanceText")
        .innerText =
        `隊伍長度：${Math.round(d)} 公尺`;
    }
}

/* 神轎同步 */

function syncPalanquin(lat,lng){

    godPos = [lat,lng];

    const currentPos = L.latLng(lat,lng);

    let minDist = Infinity;
    let closestIdx = 0;

    routePoints.forEach((p,i)=>{

        let d =
            L.latLng(p)
            .distanceTo(currentPos);

        if(d < minDist){

            minDist = d;
            closestIdx = i;

        }

    });

    palanquinMarker.setLatLng(routePoints[closestIdx]);

    passedPath.setLatLngs(
        routePoints.slice(0,closestIdx+1)
    );

    calculateDistance();
}

/* Firebase 監聽 */

db.ref('palanquin/location')
.on('value',(snapshot)=>{

    const d = snapshot.val();

    if(d){

        syncPalanquin(d.lat,d.lng);

        document.getElementById("statusText")
        .innerText =
        "最後更新：" +
        new Date(d.timestamp)
        .toLocaleTimeString();

    }

});

/* 隊伍尾端 */

db.ref('palanquin/tail')
.on('value',(snapshot)=>{

    const d = snapshot.val();

    if(d){

        tailPos = [d.lat,d.lng];

        tailMarker
        .setLatLng(tailPos)
        .setOpacity(1);

        calculateDistance();

    }

});

/* =========================================
   神轎頭 GPS 回報
========================================= */

let adminWatch = null;
let tailWatch = null;

function toggleAdminMode(){

    if(adminWatch){

        navigator.geolocation.clearWatch(adminWatch);

        adminWatch = null;

        alert("已停止神轎頭定位");

        return;
    }

    adminWatch =
    navigator.geolocation.watchPosition(

        (pos)=>{

            db.ref('palanquin/location')
            .set({

                lat:pos.coords.latitude,
                lng:pos.coords.longitude,
                timestamp:Date.now()

            });

        },

        (err)=>{
            alert("GPS失敗："+err.message);
        },

        {
            enableHighAccuracy:true,
            maximumAge:1000
        }

    );

    alert("神轎頭定位啟動");

}

/* =========================================
   隊伍尾端 GPS
========================================= */

function toggleTailMode(){

    if(tailWatch){

        navigator.geolocation.clearWatch(tailWatch);

        tailWatch = null;

        alert("已停止尾端定位");

        return;
    }

    tailWatch =
    navigator.geolocation.watchPosition(

        (pos)=>{

            db.ref('palanquin/tail')
            .set({

                lat:pos.coords.latitude,
                lng:pos.coords.longitude,
                timestamp:Date.now()

            });

        },

        (err)=>{
            alert("GPS失敗："+err.message);
        },

        {
            enableHighAccuracy:true,
            maximumAge:1000
        }

    );

    alert("尾端定位啟動");

}

/* =========================================
   清除路徑
========================================= */

function clearRoutePath(){

    if(confirm("確定清除灰色已行經路線？")){

        passedPath.setLatLngs([]);

    }

}

/* =========================================
   長官報到系統
========================================= */

const officials = [
    '縣長',
    '李副縣長',
    '陳副縣長',
    '議長',
    '副議長'
];

function initOfficials(){

    const arrivalGrid =
    document.getElementById("arrivalGrid");

    const departureGrid =
    document.getElementById("departureGrid");

    officials.forEach(name=>{

        arrivalGrid.innerHTML += `
        <div class="item">
            <button class="arrive"
            onclick="reportStatus('${name}','蒞')">
            ${name}
            </button>
            <div class="time"
            id="time-${name}-蒞">--:--</div>
        </div>
        `;

        departureGrid.innerHTML += `
        <div class="item">
            <button class="leave"
            onclick="reportStatus('${name}','離')">
            ${name}
            </button>
            <div class="time"
            id="time-${name}-離">--:--</div>
        </div>
        `;

    });

}

initOfficials();

/* 回報 */

function reportStatus(person,type){

    db.ref(`officials/${person}/${type}`)
    .set({

        timestamp:Date.now()

    });

}

/* 監聽 */

db.ref('officials')
.on('value',(snapshot)=>{

    const data = snapshot.val() || {};

    officials.forEach(name=>{

        ['蒞','離'].forEach(type=>{

            const el =
            document.getElementById(
                `time-${name}-${type}`
            );

            if(
                data[name] &&
                data[name][type]
            ){

                const t =
                new Date(
                    data[name][type].timestamp
                );

                el.innerText =
                    String(t.getHours()).padStart(2,'0')
                    + ":" +
                    String(t.getMinutes()).padStart(2,'0');

            }else{

                el.innerText = "--:--";

            }

        });

    });

});

</script>

</body>
</html>
